[package]
name = "pencere-cli"
description = "The pencere command: new, dev and build for apps written in Lua, and the runner that a built app is — one file, with its view"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "pencere", "lua", "cli"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "pencere"
path = "src/main.rs"

[dependencies]
# The program's side of the protocol: the handshake, the tty, the signals, the way out. The
# runner is a program like any other that uses it; what Lua adds is the language.
pencere = { path = "../program", version = "0.2.0" }
# The bundle of a view is the wire's; the runner reads digests and base64 with the same code.
pencere-wire = { path = "../wire", version = "0.2.0" }
serde_json = "1"
libc = "0.2"
# Luau, the dialect the page API is in, so that an app and its page are one language. Luau is
# compiled into the binary from the crate's sources; no Lua is installed on the machine.
mlua = { version = "0.11", features = ["luau"] }
# Puts the app into a copy of the runner as a section of the executable, and signs the result
# on a Mac (an ad hoc signature, made in this process: no `codesign`, and a Linux machine can
# make the file of a Mac).
libsui = "0.16"
sha2 = "0.10"
# Patterns a person types in a search (`pencere.regex`), and patterns a page sends. The engine
# runs in time that grows with the text and never backtracks, so no pattern can hold the app; what
# needs a search to go back (back-references, look-around) is refused. Of the Unicode tables only
# the ones a search uses are in: case, letters and digits (`\p{L}`), and the word classes; the
# runner is copied into every app, and the tables of scripts and ages are more than 100 KB of it.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-gencat", "unicode-perl"] }

[lints]
workspace = true
