[package]
name = "containers-rust"
description = "A made-up Docker host, and the smallest program that shows a view of its own: the container list as a Lua script, drawn by the terminal, written with the pencere library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Everything a program does to show a view: the handshake, the terminal's modes, the signals, the
# way out. This program is its calls and its subscription, and the list it makes up.
pencere = { path = "../../program" }
# Where the terminal shows no view, the same view in the cells of the terminal: `serve` of this
# crate is the library's, with the screen behind it.
pencere-tui = { path = "../../host/tui", default-features = false }
# The containers of the example and the numbers a made-up host reports for them: one list, the
# page's own, not a copy in the program.
containers-page = { path = "../containers-page" }
serde_json = "1"

# What the terminal in it is built with (the features of `pencere-tui`): `compiler` and `pdf` by
# default, so that a build of the example is the one a pen makes; with them off and `precompile` on, it
# is the build with the least in it
# (`cargo build -p containers-rust --no-default-features --features precompile`).
[features]
default = ["compiler", "pdf"]
compiler = ["pencere-tui/compiler"]
precompile = ["pencere-tui/precompile"]
pdf = ["pencere-tui/pdf"]

[dev-dependencies]
# The page and this program's handlers in one process, under a host with no screen.
pencere-drive = { path = "../../kit/drive", features = ["program"] }

[lints]
workspace = true
