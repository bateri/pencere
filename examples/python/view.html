<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        padding: 1.5rem 2rem;
        background: var(--color-background-primary, #111318);
        color: var(--color-text-primary, #d8dbe2);
        font-family: var(--font-mono, ui-monospace, monospace);
        font-size: 14px;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: 1rem;
        font-weight: 600;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li button {
        display: flex;
        gap: 0.75rem;
        width: 100%;
        padding: 0.35rem 0.5rem;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      li.chosen button {
        background: var(--color-background-secondary, #1c1f27);
      }
      li.done .title {
        color: var(--color-text-secondary, #8b909c);
        text-decoration: line-through;
      }
      #status {
        margin: 1rem 0 0;
        color: var(--color-text-secondary, #8b909c);
      }
      #status.failed {
        color: var(--color-text-danger, #f85149);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tasks</h1>
      <ul id="tasks"></ul>
      <p id="status" role="status"></p>
    </main>
    <script>
      "use strict";

      // The view, written against the MCP Apps messages and nothing else: JSON-RPC
      // over postMessage to the host, which is whatever shows this page (a chat
      // client's frame, a terminal's pane). It needs no build step and no library.
      const PROTOCOL_VERSION = "2026-01-26";
      const list = document.getElementById("tasks");
      const status = document.getElementById("status");

      let tasks = [];
      let chosen = 0;
      let busy = false;
      let nextId = 1;
      const pending = new Map();

      const send = (message) => window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*");

      function request(method, params) {
        return new Promise((resolve, reject) => {
          const id = nextId++;
          pending.set(id, { resolve, reject });
          send({ id, method, params });
        });
      }

      function say(text, failed = false) {
        status.textContent = text;
        status.className = failed ? "failed" : "";
      }

      function textOf(result) {
        const first = (result.content || []).find((item) => item.type === "text");
        return first ? first.text.split("\n")[0] : "";
      }

      function applyHostContext(context) {
        const root = document.documentElement;
        if (context.theme) root.setAttribute("data-theme", context.theme);
        const variables = (context.styles && context.styles.variables) || {};
        for (const [name, value] of Object.entries(variables)) {
          if (typeof value === "string") root.style.setProperty(name, value);
        }
      }

      function render() {
        list.replaceChildren(
          ...tasks.map((task, index) => {
            const item = document.createElement("li");
            item.className = (task.done ? "done" : "") + (index === chosen ? " chosen" : "");
            const button = document.createElement("button");
            button.setAttribute("aria-busy", String(busy));
            const box = document.createElement("span");
            box.textContent = task.done ? "[x]" : "[ ]";
            const title = document.createElement("span");
            title.className = "title";
            title.textContent = task.title;
            button.append(box, title);
            button.addEventListener("click", () => toggle(index));
            item.append(button);
            return item;
          }),
        );
      }

      function adopt(result) {
        const listed = result.structuredContent && result.structuredContent.tasks;
        if (!Array.isArray(listed)) return false;
        tasks = listed;
        chosen = Math.min(chosen, Math.max(tasks.length - 1, 0));
        render();
        return true;
      }

      async function toggle(index) {
        const task = tasks[index];
        if (!task || busy) return;
        chosen = index;
        busy = true;
        render();
        try {
          const result = await request("tools/call", {
            name: "toggle_task",
            arguments: { id: task.id },
          });
          if (result.isError) say(textOf(result), true);
          else {
            adopt(result);
            say(textOf(result));
          }
        } catch (error) {
          say(error.message, true);
        } finally {
          busy = false;
          render();
        }
      }

      function handleNotification(method, params) {
        if (method === "ui/notifications/tool-result") {
          if (params.isError) say(textOf(params), true);
          else if (adopt(params)) say(textOf(params));
        } else if (method === "ui/notifications/host-context-changed") {
          applyHostContext(params);
        }
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (typeof message.method === "string") {
          if (message.id === undefined) handleNotification(message.method, message.params || {});
          // The host asks the view to wind up before it takes it down, and may ping it.
          else if (message.method === "ui/resource-teardown" || message.method === "ping")
            send({ id: message.id, result: {} });
          else send({ id: message.id, error: { code: -32601, message: "method not found" } });
          return;
        }
        const waiting = pending.get(message.id);
        if (!waiting) return;
        pending.delete(message.id);
        if (message.error) waiting.reject(new Error(message.error.message));
        else waiting.resolve(message.result);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown" && chosen < tasks.length - 1) chosen += 1;
        else if (event.key === "ArrowUp" && chosen > 0) chosen -= 1;
        else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggle(chosen);
          return;
        } else return;
        event.preventDefault();
        render();
      });

      // `pencere/pane` says this view was written for the terminal: it may take its
      // container to be the whole pane and every key to be its own. A host that does
      // not know the name ignores it.
      say("Waiting for the host…");
      request("ui/initialize", {
        appInfo: { name: "tasks", version: "1.0.0" },
        appCapabilities: { experimental: { "pencere/pane": {} } },
        protocolVersion: PROTOCOL_VERSION,
      }).then(
        (result) => {
          applyHostContext(result.hostContext || {});
          send({ method: "ui/notifications/initialized" });
        },
        (error) => say(error.message, true),
      );
    </script>
  </body>
</html>
