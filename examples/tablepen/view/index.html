<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <input
        id="filter"
        type="search"
        placeholder="Filter"
        aria-label="Filter the rows"
        autocomplete="off"
        spellcheck="false"
      />
      <p id="status" role="status"></p>
    </header>
    <div id="scroll">
      <table aria-label="Table">
        <thead>
          <tr id="head"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <footer>
      <p class="keys" id="keys"></p>
      <div id="actions" hidden>
        <button id="cancel" type="button">Cancel</button>
        <button id="choose" type="button" class="primary" disabled>Choose</button>
      </div>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
