[package]
name = "pencere"
description = "Host side of pencere, the terminal side of MCP Apps: frames, messages, session rules and bundles, without I/O"
# The crate's own version line, apart from the workspace's: it is released on its own
# (RELEASING.md), and the stand-in host that shares the workspace is never published.
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mcp", "mcp-apps", "terminal", "pencere"]
categories = ["parser-implementations"]
# The tests read the specification's fixtures from the repository, outside the crate,
# so the package carries the library and what a reader of it needs, not the tests.
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value` lets a message from the program be routed by its id and method
# without building a tree of its whole body, which a hostile stream could make
# many times larger than the text.
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[lints]
workspace = true
