[package]
name = "pencere-tui"
description = "The cells of a terminal as a host of pencere's native views: a page drawn with characters, for a program whose terminal does not host them"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "pencere", "tui"]
categories = ["command-line-interface", "gui"]
include = ["src/**", "!src/*_tests.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[dependencies]
# The page engine's types: the draw list the page hands out, the colours and the text a host measures.
pencere-view = { path = "../../kit/view", version = "0.4.1" }
# The sandbox's pictures: the pixels of an image and of a canvas, the one door to the decoders and
# the rasteriser of every host.
pencere-sandbox = { path = "../../kit/sandbox", version = "0.4.1", default-features = false }
# How many cells of a terminal a character takes (a letter one, a Chinese character or an emoji two).
unicode-width = "0.2"
# The page the screen runs and draws: its frames, its input, and what it says to its host
# (`Host`). The page's side of the program's view; the host of a terminal that hosts views links it
# too.
pencere-drive = { path = "../../kit/drive", version = "0.4.1", default-features = false }
# The program's side of the view: its options (the handlers the page calls), the terminal it takes
# for the screen (`Tty`), and the conversation with the handlers. The live screen is what a program
# that carries its own view shows where no terminal hosts it.
pencere = { path = "../../program", version = "0.4.1" }

[features]
default = ["compiler", "pdf"]
# What the sandbox and the drive are built with (their features of the same names).
compiler = ["pencere-sandbox/compiler", "pencere-drive/compiler"]
pdf = ["pencere-sandbox/pdf", "pencere-drive/pdf"]

[dev-dependencies]
# The terminal a test runs a program in: a pty to read what it draws and to type into.
pencere-fake-host = { path = "../fake" }
# The size of that pty's window.
libc = "0.2"

[lints]
workspace = true
