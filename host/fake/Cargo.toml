[package]
name = "pencere-fake-host"
description = "A stand-in terminal for the authors of programs and for tests: runs a program on a pty and plays the host of its views, so a program can be tried without a terminal that hosts pencere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pencere-host = { path = "../rust" }
# The view a program opens, run for real under the host with no screen (`program`): the drive of a
# page, and the sandbox's `Assets` its files are read through.
pencere-drive = { path = "../../kit/drive" }
pencere-sandbox = { path = "../../kit/sandbox" }
serde_json = "1"
# The pty and the poll: what a terminal does and the crate, which does no I/O,
# leaves to it.
libc = "0.2"

[dev-dependencies]
# The keys a test presses on a page run for real.
pencere-view = { path = "../../kit/view" }

[lints]
workspace = true
