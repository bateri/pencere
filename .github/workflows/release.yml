# Releases what a commit on main has prepared (RELEASING.md). It runs on every push to main, and
# when it is started by hand. It is started by the push itself, not by the gate's run finishing
# (`workflow_run`): crates.io refuses trusted publishing to a run started that way.
#
# - plan: the lines whose version has no tag yet (`make release-prepare`, committed and pushed),
#   each checked. A commit that prepared nothing ends here.
# - gate: the gate (check.yml) on the commit to release, called here so that nothing is tagged
#   before it is green.
# - the packages of each line are checked, and the command's four executables are built on a
#   runner of their system and architecture, tried, summed and attested (provenance).
# - each line is tagged (`<line>-v<version>`) and its GitHub release written as a draft, with the
#   changelog section as its notes and, for the command, the files.
# - publish: each line waits in the `release` environment for a maintainer to approve it, and is
#   then published by its kind: npm and crates.io take the workflow's word for who it is (trusted
#   publishing), the command's files are verified against their sums and attestations, and the
#   draft is made public. The command is published after the SDK and the crates, and is the only
#   Latest.
#
# Started by hand, it releases the line chosen on main's newest commit: a release that stopped half
# way (tagged, not yet public) is finished, from the commit of its tag when main has gone on. With
# `rehearse` it only checks and builds, on any branch, and keeps the command's files as workflow
# artifacts: no tag, no release, no attestation.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      line:
        description: The line to release
        type: choice
        options:
          - sdk-typescript
          - crates
          - cli
        required: true
      rehearse:
        description: Only check and build; tag and publish nothing
        type: boolean
        default: false

# One release at a time, and none is cut short by the next.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # A push to the main branch of a fork is never a release.
  plan:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      # The commit started on, or the one plan names to finish a release from.
      sha: ${{ steps.plan.outputs.sha || steps.sha.outputs.sha }}
      rehearse: ${{ steps.sha.outputs.rehearse }}
      lines: ${{ steps.plan.outputs.lines }}
      sdk-typescript: ${{ steps.plan.outputs.sdk-typescript }}
      crates: ${{ steps.plan.outputs.crates }}
      cli: ${{ steps.plan.outputs.cli }}
    steps:
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          REHEARSE: ${{ inputs.rehearse == true }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "rehearse=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$REHEARSE" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::a release is made from main; start it on main, or rehearse"
              exit 1
            fi
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "rehearse=$REHEARSE" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ inputs.line }}
          RELEASE_REHEARSE: ${{ steps.sha.outputs.rehearse }}
        run: node tools/release.mjs plan "$LINE" >> "$GITHUB_OUTPUT"

  # The gate, on the commit to release, whenever there is one (a rehearsal is not one).
  gate:
    needs: plan
    if: needs.plan.outputs.lines != '[]' && needs.plan.outputs.rehearse != 'true'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
    permissions:
      contents: read

  # From here each job asks for the gate, which a rehearsal skips: with `always()`, as GitHub skips
  # a job after any skipped job in its chain otherwise.

  # The package npm would publish: its files, built from a clean install.
  npm:
    needs: [plan, gate]
    if: >-
      always() && needs.plan.outputs.sdk-typescript == 'true' &&
      (needs.gate.result == 'success' || needs.plan.outputs.rehearse == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/release.mjs package sdk-typescript

  # The package of each crate, built from its own files against crates.io (its dry run).
  crates:
    needs: [plan, gate]
    if: >-
      always() && needs.plan.outputs.crates == 'true' &&
      (needs.gate.result == 'success' || needs.plan.outputs.rehearse == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
      - run: node tools/release.mjs package crates

  # The command's executables, each on a runner of its own system and architecture (no emulation).
  # The Linux ones are built in the image of tools/linux/Dockerfile, the macOS ones by one
  # compiler for both targets, with the toolchain the gate runs with. Each is tried where its
  # runner can run it (tools/dist.sh): the log of the macOS job says whether the Intel executable
  # could be run. Nothing is taken from a cache: what is released is built from nothing.
  build:
    needs: [plan, gate]
    if: >-
      always() && needs.plan.outputs.cli == 'true' &&
      (needs.gate.result == 'success' || needs.plan.outputs.rehearse == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            make: dist-macos DIST_TOOLCHAIN=1.88
          - name: linux-x86_64
            os: ubuntu-24.04
            make: dist-linux ARCH=x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            make: dist-linux ARCH=aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.name == 'macos'
        run: rustup toolchain install 1.88 --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
      - env:
          DIST_NATIVE: "1"
        run: make ${{ matrix.make }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.name }}
          path: dist/pencere-*
          if-no-files-found: error

  # The four executables together: SHA256SUMS, a check of all of it (the system and processor each
  # name says, the sums), and for a release the attestation of what was built here. The files are
  # kept as a workflow artifact, for the draft and for a rehearsal.
  files:
    needs: [plan, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - run: make dist-sums
      - run: node tools/release.mjs dist cli dist
      - if: needs.plan.outputs.rehearse != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pencere-*
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  # Each line's tag, once all of its checks and builds are green, and its GitHub release as a
  # draft: the changelog section for its notes, the files of the command. A job that is run again
  # leaves a tag that is on this commit and makes the draft again; a release that is public is not
  # touched.
  draft:
    needs: [plan, gate, npm, crates, build, files]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.rehearse != 'true' &&
      needs.gate.result == 'success' &&
      needs.plan.outputs.lines != '[]' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: needs.plan.outputs.cli == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          LINES: ${{ needs.plan.outputs.lines }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for line in $(echo "$LINES" | jq -r '.[]'); do
            node tools/release.mjs tag "$line"
            node tools/release.mjs draft "$line" dist
          done

  # From here, each line waits for a maintainer's approval in the `release` environment (Settings,
  # Environments: its required reviewers), and nothing is public before it.
  #
  # Each publishing job says `always()`: without it GitHub puts `success()` in front of its `if`, and
  # that is false when any job before it in the chain was skipped, as the jobs of a line that is not
  # released in this run are (crates 0.3.0 was drafted and then skipped because the SDK's `npm` job
  # was). Failure and cancellation are still refused.
  publish-sdk:
    needs: [plan, draft]
    if: >-
      always() && needs.draft.result == 'success' && needs.plan.outputs.sdk-typescript == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: release
        run: node tools/release.mjs publish sdk-typescript

  publish-crates:
    needs: [plan, draft]
    if: >-
      always() && needs.draft.result == 'success' && needs.plan.outputs.crates == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
      # A token crates.io gives for this run alone, in exchange for the workflow's identity.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_ENVIRONMENT: release
        run: node tools/release.mjs publish crates

  # After the SDK and the crates, when they are released in the same run: the command's projects ask
  # for them (publish refuses the command while either is not on its registry).
  publish-cli:
    needs: [plan, draft, publish-sdk, publish-crates]
    if: >-
      always() && needs.draft.result == 'success' && needs.plan.outputs.cli == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # `cargo info` asks crates.io whether the program library is there.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: release
        run: node tools/release.mjs publish cli
