# The gate on every push to main and every pull request: `make check`, on the two
# systems the specification describes (Appendix B measures the tty of both).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The toolchain the crate's rust-version names, so a new lint of a later
      # release does not turn the gate red on code nobody touched.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      # The runtimes the SDK runs on besides Node: the tty and end-to-end tests of the others run
      # when they are there, and say SKIPPED when they are not. The versions are the ones the tests
      # were written against.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.0.0
      - run: npm ci
      # The first `deno compile` of a version of Deno downloads the runtime it builds on. The gate
      # never reaches the network, so its test of the compiled example only runs if that is done
      # already: this is where it is.
      - run: |
          npx tsc -b
          cd examples/containers
          deno task compile
      - run: make check
