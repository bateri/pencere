# The gate on every push to main and every pull request: `make check` and `make check-heavy`,
# on the two systems the specification describes (Appendix B measures the tty of both). The release
# workflow runs it too (`workflow_call`), on the commit it releases, before it tags anything.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

# A new push to a pull request makes the run of the one before it moot. On main every commit keeps
# its own run, so each has a result.
# Called by the release workflow, the run is that workflow's (`github.workflow`), and is kept apart
# from the gate's own run of the same push.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty but when the release workflow calls: the commit of the push or the pull request.
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # The toolchain the crate's rust-version names, so a new lint of a later
      # release does not turn the gate red on code nobody touched.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      # The page modules and the example program are built with rustup's stable toolchain and its
      # WebAssembly target (`make guest`); the gate itself runs with the toolchain above.
      - run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      # The dependencies compiled by an earlier run, for both workspaces (the page modules' is
      # kit/guest). Only main saves, so a pull request reads main's and does not crowd it out.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gate
          workspaces: |
            . -> target
            kit/guest -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The runtimes the SDK runs on besides Node: the tty and end-to-end tests of the others run
      # when they are there, and say SKIPPED when they are not. The versions are the ones the tests
      # were written against.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.0.0
      - run: npm ci
      # The first `deno compile` of a version of Deno downloads the runtime it builds on. The gate
      # never reaches the network, so its test of the compiled example only runs if that is done
      # already: this is where it is.
      - run: |
          npx tsc -b
          cd examples/containers
          deno task compile
      - run: make check
      - run: make check-heavy
