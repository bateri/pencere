# The tools that build the interpreter's component (`make luau`): `cbindgen`, which writes the C
# bindings of the interface in `kit/wit` that the interpreter is built against, and `componentize`,
# which turns the interpreter's core module into the component the sandbox runs. Another workspace
# on purpose — they are built with the rustup `stable` toolchain, while the terminal-side crates
# are built with the toolchain the repository pins; `make check` only formats them.
[workspace]
resolver = "3"
members = ["componentize", "cbindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/bateri/pencere"
# These are tools of the repository and are never published.
publish = false

# The same rules as the terminal-side crates.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
# The tool that turns a core module into a component. A version of the era of the runtime the
# sandbox links.
wit-component = "=0.239.0"
# The generator of the C bindings (`cbindgen`), a release of the bindings generator that matches
# the runtime.
wit-bindgen-c = "=0.46.0"
wit-bindgen-core = "=0.46.0"
