[package]
name = "pencere-drive"
description = "The drive of a page of pencere's native views: what the person does told to the page, its frames laid out with its editors and its scrolling, its replies and wakes handed to the host — and a host with no screen, to test a page with"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "pencere", "ui", "testing"]
categories = ["gui", "development-tools::testing"]
# The tests of `src/` read the example pages of the repository, which a crate does not carry.
include = [
    "src/**", "!src/*_tests.rs", "!src/fixtures/**",
    "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE",
]

[dependencies]
# The page engine: what a page is, how it is laid out, scrolled and moved, and what it says back.
pencere-view = { path = "../view", version = "0.3.1" }
# The editor of text the host puts in each editor's room: the drive keeps the page's editors.
pencere-editor = { path = "../editor", version = "0.3.1" }
# The sandbox the page runs in, and its images: the drive tells it and takes what it puts out.
pencere-sandbox = { path = "../sandbox", version = "0.3.1" }
# The six messages of a program and its view (`messages::Message`): the program of a page under the
# headless host (`headless::Calls`) reads and answers them as the program library does. Already in
# the graph by the sandbox, which depends on the wire.
pencere-wire = { path = "../../wire", version = "0.3.1" }
# The values of those messages, which a test's handlers take and return. Already in the graph by
# the wire.
serde_json = "1"
tiny-skia = { version = "0.12", optional = true }
fontdue = { version = "0.9", optional = true, default-features = false, features = ["std", "simd"] }

# Pictures of a page for the eye (`shot`), off unless asked: the draw list rasterised by tiny-skia
# (BSD-3-Clause; the SVG renderer's own, already in the graph by the sandbox, with its PNG encoder)
# and the caller's fonts read by fontdue (MIT, Apache-2.0 or Zlib, with ttf-parser, MIT or
# Apache-2.0). A terminal that drives pages has no use for either and links neither (`make check`).
[features]
shot = ["dep:tiny-skia", "dep:fontdue"]

[lints]
workspace = true
