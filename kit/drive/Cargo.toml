[package]
name = "pencere-drive"
description = "The drive of a page of pencere's native views: what the person does told to the page, its frames laid out with its editors and its scrolling, its replies and wakes handed to the host — and a host with no screen, to test a page with"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "pencere", "ui", "testing"]
categories = ["gui", "development-tools::testing"]
# The tests of `src/` read the example pages of the repository, which a crate does not carry.
include = [
    "src/**", "!src/*_tests.rs", "!src/fixtures/**",
    "Cargo.toml", "build.rs", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "fonts/**",
]

[dependencies]
# The page engine: what a page is, how it is laid out, scrolled and moved, and what it says back.
pencere-view = { path = "../view", version = "0.4.1" }
# The editor of text the host puts in each editor's room: the drive keeps the page's editors.
pencere-editor = { path = "../editor", version = "0.4.1" }
# The sandbox the page runs in, and its images: the drive tells it and takes what it puts out.
pencere-sandbox = { path = "../sandbox", version = "0.4.1", default-features = false }
# The six messages of a program and its view (`messages::Message`): the program of a page under the
# headless host (`headless::Calls`) reads and answers them as the program library does. Already in
# the graph by the sandbox, which depends on the wire.
pencere-wire = { path = "../../wire", version = "0.4.1" }
# The values of those messages, which a test's handlers take and return. Already in the graph by
# the wire.
serde_json = "1"
# A program in this process (`headless::InProcess`), off unless asked: the program library's own
# handlers, served by its `Conversation` as `serve` serves them. The library is the program's side,
# which a terminal that drives pages has no use for and does not link (`make check`).
pencere = { path = "../../program", version = "0.4.1", optional = true }
tiny-skia = { version = "0.12", optional = true }
swash = { version = "0.2", optional = true }
memmap2 = { version = "0.9", optional = true }
# The faces the picture carries are packed (zlib) when the crate is built and unpacked, once, where
# a machine has no face of its own (miniz_oxide, MIT or Zlib or Apache-2.0; already in the graph by
# the PNG encoder). The build script packs them with the same crate, and does nothing without `shot`.
miniz_oxide = { version = "0.8", optional = true }

[build-dependencies]
miniz_oxide = "0.8"

# Pictures of a page for the eye (`shot`), off unless asked: the draw list rasterised by tiny-skia
# (BSD-3-Clause; the SVG renderer's own, already in the graph by the sandbox, with its PNG encoder)
# and the faces of the machine drawn by swash (Apache-2.0 or MIT, with zeno and yazi, the same; it
# reads the weight axis of a variable face, the colour glyphs of Apple Color Emoji and Noto Color
# Emoji, and sits on skrifa, which the PDF reader already has) out of files memory-mapped
# (memmap2, Apache-2.0 or MIT: Apple Color Emoji is 190 MB, and a picture of a page with no emoji
# reads none of it). The session crate that drives pages has no use for any and links none; the terminal
# side that sends a page to a terminal as a picture (`pencere-tui`) links them (`make audit`).
[features]
default = ["compiler", "pdf"]
# What the sandbox is built with (its features of the same names).
compiler = ["pencere-sandbox/compiler"]
precompile = ["pencere-sandbox/precompile"]
pdf = ["pencere-sandbox/pdf"]
shot = ["dep:tiny-skia", "dep:swash", "dep:memmap2", "dep:miniz_oxide"]
program = ["dep:pencere"]

[lints]
workspace = true
