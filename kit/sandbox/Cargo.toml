[package]
name = "pencere-sandbox"
description = "The sandbox of pencere's native views: a Lua script, run by an interpreter that is a WebAssembly component, with no file, network or clock, and is asked for a page to lay out and draw"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "pencere", "wasm", "sandbox"]
categories = ["wasm", "gui"]
# The tests of `src/` read the scripts of `kit/luau` and the containers example, none of which a
# crate carries; `wit/` is the crate's own copy of the
# interface (`make check` keeps it equal to `kit/wit/view.wit`), and `library/` the kit's library
# of Luau, which the crate gives scripts.
include = [
    "src/**", "!src/*_tests.rs", "!src/fixtures/**",
    "wit/**", "luau/luau.wasm", "luau/inputs.sha256", "licenses/**", "library/**",
    "build.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE",
]

[dependencies]
# The page engine: the tree a module hands out is read into its elements, and what the module
# is asked of the page laid out is answered from its layout. No crate of this workspace besides
# this and the wire below, no platform library (`make check`) — the sandbox moves with the engine.
pencere-view = { path = "../view", version = "0.4.1" }
# The size of a message as the protocol counts it (`json::unescaped_len`): the terminal, the
# program and this sandbox hold a message to its limit by one function. The wire is bytes and no
# decisions, and the sandbox links to nothing else of the terminal's.
pencere-wire = { path = "../../wire", version = "0.4.1" }
# The WebAssembly runtime, linked by this crate alone (`make check`). The Cranelift compiler
# needs a host that may make executable memory, which a terminal built on this crate asks of
# the system.
wasmtime = { version = "38", default-features = false, features = [
    "runtime", "component-model", "std", "gc", "gc-drc",
] }

# The decoders of the images a page shows (`images`): PNG, JPEG, SVG and PDF, each a library in
# Rust, linked by this crate alone, so that every terminal that shows these pages takes the same
# formats and the same limits. All of them are MIT, Apache-2.0, BSD, Zlib or Unicode-3.0 (see the
# changelog).
# The SVG renderer is built with neither text nor raster images nor compressed files: an
# SVG draws shapes, and reads nothing of the machine it is drawn on. The PDF renderer is built
# with the substitutes for the fourteen fonts a PDF need not carry (`embed-fonts`: the crate
# holds them, and no font of the machine is read) and with the predefined CMaps (`embed-cmaps`)
# that most Chinese, Japanese and Korean text is read through.
png = "0.18"
# The JPEG decoder's vector code (`x86`, `neon`) is named, as the PDF reader's libraries ask for it
# too: a build with no PDF reader (`pdf` off) decodes a JPEG with the same code as one with it.
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
resvg = { version = "0.48.1", default-features = false }
hayro = { version = "0.9", default-features = false, features = ["embed-fonts", "embed-cmaps"], optional = true }

# The decoders of the sounds a page plays (`sounds`): WAV (`hound`, Apache-2.0) and Ogg Vorbis
# (`lewton`, MIT OR Apache-2.0, and the Ogg container it reads through, `ogg`, BSD-3-Clause), both
# in Rust and linked by this crate alone, as the images' are, so that every terminal that plays
# these pages takes the same formats and the same limits. The bytes are a file a program sent: a
# decoder's panic is the file's being unreadable (the plan of the set, decision 6).
hound = "3.5"
lewton = "0.10"

# Regular expressions (MIT or Apache-2.0), the same crate and features as the editor's: the rules of
# an editor's indent a page says are compiled here as the editor compiles them, so that one that is
# no pattern fails the page that said it, with the option's name, and is never dropped without a
# word.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

# With the `precompile` feature (and no `compiler`) the interpreter is compiled for the target here,
# while the crate is built (`build.rs`), and the runtime above has no code generator: this is that
# generator. It runs on the machine that builds, for the target the crate is built for, which is
# another architecture when an executable is built for one (the Intel macOS and Linux executables on
# an Apple silicon Mac): `all-arch` is the code generators of them all. It is optional so that the
# builds that compile the interpreter as the first page opens (the defaults) do not compile a second
# code generator they never run. It has the name of the runtime's dependency, as cargo takes no
# crate twice under two names in one package, and that is why `compiler` says `wasmtime?/cranelift`:
# without the `?` it would turn this one on too.
[build-dependencies]
wasmtime = { version = "38", default-features = false, features = [
    "runtime", "cranelift", "all-arch", "component-model", "std", "gc", "gc-drc",
], optional = true }

[features]
default = ["compiler", "pdf"]
# The Cranelift code generator in the runtime: the interpreter is compiled to machine code as the
# first page opens. A build that takes it off must take `precompile` instead (the build fails
# naming both, otherwise): the runtime then cannot compile a module.
compiler = ["wasmtime?/cranelift"]
# The interpreter compiled for the target by the build (`build.rs`) and loaded as it is, for a build
# with no `compiler`. Ignored where `compiler` is on too (a test build that is both, as features
# of one package are unified, compiles the interpreter as the first page opens).
precompile = ["dep:wasmtime"]
# The PDF reader (`hayro`). Off, a PDF a page shows is refused as an image it cannot read.
pdf = ["dep:hayro"]

[dev-dependencies]
# Modules written as text for the sandbox's tests (`.wat`), so that `make check` does not need
# the toolchain that builds a real one.
wasmtime = { version = "38", default-features = false, features = [
    "runtime", "cranelift", "component-model", "std", "gc", "gc-drc", "wat",
] }
# The page the tests compare a script's with: the container list, written once and run natively
# here as the script runs in the sandbox.
containers-page = { path = "../../examples/containers-page" }
# The host's editors, whose rules of indent a test holds the sandbox's to (the two compile them
# alike); the sandbox itself never links them (`make check`). A page driven with its editors is
# `pencere-drive`'s to test.
pencere-editor = { path = "../editor" }

[lints]
workspace = true
