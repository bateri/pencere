[package]
name = "pencere-sandbox"
description = "The sandbox of pencere's native views: a WebAssembly component or a Lua script that runs with no file, network or clock, and is asked for a page to lay out and draw"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["terminal", "pencere", "wasm", "sandbox"]
categories = ["wasm", "gui"]
# The tests of `src/` read the scripts of `kit/luau`, the page modules of `kit/guest` and the
# containers example, none of which a crate carries; `wit/` is the crate's own copy of the
# interface (`make check` keeps it equal to `kit/wit/view.wit`).
include = [
    "src/**", "!src/*_tests.rs", "!src/fixtures/**",
    "wit/**", "luau/luau.wasm", "luau/inputs.sha256", "licenses/**",
    "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE",
]

[dependencies]
# The page engine: the tree a module hands out is read into its elements, and what the module
# is asked of the page laid out is answered from its layout. No crate of this workspace besides
# this and the wire below, no platform library (`make check`) — the sandbox moves with the engine.
pencere-view = { path = "../view", version = "0.2.0" }
# The size of a message as the protocol counts it (`json::unescaped_len`): the terminal, the
# program and this sandbox hold a message to its limit by one function. The wire is bytes and no
# decisions, and the sandbox links to nothing else of the terminal's.
pencere-wire = { path = "../../wire", version = "0.2.0" }
# The WebAssembly runtime, linked by this crate alone (`make check`). The Cranelift compiler
# needs a host that may make executable memory, which a terminal built on this crate asks of
# the system.
wasmtime = { version = "38", default-features = false, features = [
    "runtime", "cranelift", "component-model", "std", "gc", "gc-drc",
] }

# The decoders of the images a page shows (`images`): PNG, JPEG and SVG, each a library in
# Rust, linked by this crate alone, so that every terminal that shows these pages takes the same
# formats and the same limits. All of them are MIT, Apache-2.0, BSD or Zlib (see the changelog).
# The SVG renderer is built with neither text nor raster images nor compressed files: an
# SVG draws shapes, and reads nothing of the machine it is drawn on.
png = "0.18"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
resvg = { version = "0.48.1", default-features = false }

[dev-dependencies]
# Modules written as text for the sandbox's tests (`.wat`), so that `make check` does not need
# the toolchain that builds a real one.
wasmtime = { version = "38", default-features = false, features = [
    "runtime", "cranelift", "component-model", "std", "gc", "gc-drc", "wat",
] }
# The page the tests compare a module's with: the container list, written once and run natively
# here as the module runs in the sandbox.
containers-page = { path = "../../examples/containers-page" }

[lints]
workspace = true
