[workspace]
resolver = "3"
members = ["host/rust"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/bateri/pencere"

# The host library parses bytes any program in the terminal can write: a
# malformed frame must be refused, never crash the terminal that embeds it.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
